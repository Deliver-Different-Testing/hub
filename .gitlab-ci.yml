include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

# Workflow rules - prioritize merge request pipelines to block merges on failure
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

build:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  allow_failure: false
  script:
    - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    - apt-get install -y nodejs
    - dotnet restore
    - dotnet build --no-restore --configuration Release
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "master"

# Only run deploy on protected branches, not on MR pipelines
deploy-dynamic-pipeline:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

unit-tests:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  allow_failure: false
  script:
    - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    - apt-get install -y nodejs
    - dotnet restore
    - dotnet test Hub.Tests/ --no-restore --verbosity normal -- --report-xunit-trx --report-junit
  artifacts:
    when: always
    paths:
      - Hub.Tests/bin/Debug/net10.0/TestResults/
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "master"