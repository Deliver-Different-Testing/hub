include:
  - template: Auto-DevOps.gitlab-ci.yml

variables:
  CI_DEFAULT_BRANCH: backstage

workflow:
  rules:
    - if: ($CI_KUBERNETES_ACTIVE == null || $CI_KUBERNETES_ACTIVE == "") && ($KUBECONFIG == null || $KUBECONFIG == "")
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: always

stages:
  - .pre
  - build
  - test
  - review
  - dast
  - staging
  - templating
  - deploy
  - tenants-staging
  - tenants-prod
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 100%
  - release
  - performance
  - cleanup
  - .post

# Define environment file loading snippet
.load-env-file: &load-env-file
  - |
    if [ -n "$ENV_FILE" ]; then
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ ! $line =~ ^# && $line =~ = ]]; then
          eval "export $line"
        fi
      done < <(cat "$ENV_FILE")
    fi

production_manual:
  needs:
    - job: build
    - job: staging
  variables:
    ENV_FILE: $PROD_ENV
  before_script:
    - *load-env-file
    - export HELM_UPGRADE_VALUES_FILE=".gitlab/prod-auto-deploy-values.yaml"

generate-tenant-pipelines:
  stage: templating
  script:
    - ./generate-tenants-pipeline.sh
  artifacts:
    paths:
      - generated-tenant-pipelines.yml

deploy-tenants:
  stage: deploy
  trigger:
    include:
      - artifact: generated-tenant-pipelines.yml
        job: generate-tenant-pipelines