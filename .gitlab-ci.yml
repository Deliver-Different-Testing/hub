include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

# Workflow rules - prioritize merge request pipelines to block merges on failure
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

build:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  allow_failure: false
  script:
    - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    - apt-get install -y nodejs
    - dotnet restore
    - dotnet build --no-restore --configuration Release
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "master"

# Only run deploy on protected branches, not on MR pipelines
deploy-dynamic-pipeline:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

unit-tests:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  allow_failure: false
  script:
    - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    - apt-get install -y nodejs
    - dotnet restore
    # Run the suite as its own executable rather than through `dotnet test`.
    #
    # xunit.v3 builds it that way, and Microsoft.Testing.Platform 2.x - which the package bump in
    # 6e593e0 pulled in - dropped the VSTest bridge that let `dotnet test` drive one on the .NET 10
    # SDK. The command now fails before running a single test, so this job was about to start
    # failing on a change that has nothing to do with the tests.
    - dotnet build Hub.Tests/Hub.Tests.csproj --no-restore --configuration Debug
    - ./Hub.Tests/bin/Debug/net10.0/Hub.Tests -result-junit TestResults/junit.xml
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/junit.xml
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "master"