include:
  - template: Auto-DevOps.gitlab-ci.yml
  # Remove this line until the file is properly created
  # - local: .gitlab/ci-includes/env-loader.yml

variables:
  CI_DEFAULT_BRANCH: backstage

workflow:
  rules:
    - if: ($CI_KUBERNETES_ACTIVE == null || $CI_KUBERNETES_ACTIVE == "") && ($KUBECONFIG == null || $KUBECONFIG == "")
      when: never
    - if: "$CI_COMMIT_BRANCH == 'backstage'"
      when: always

stages:
  - .pre
  - templating
  - build
  - test
  - review
  - dast
  - staging
  - deploy
  - tenants-staging
  - tenants-prod
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 100%
  - release
  - performance
  - cleanup
  - .post

# Define the load-env-file anchor directly in this file
.load-env-file: &load-env-file
  - |
    if [ -n "$ENV_FILE" ]; then
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ ! $line =~ ^# && $line =~ = ]]; then
          eval "export $line"
        fi
      done < <(cat "$ENV_FILE")
    fi

production_manual:
  needs:
    - job: build
    - job: staging
  variables:
    ENV_FILE: $PROD_ENV
  before_script:
    - *load-env-file
    - export HELM_UPGRADE_VALUES_FILE=".gitlab/prod-auto-deploy-values.yaml"

generate-tenants-pipeline:
  stage: templating
  before_script:
    # alpine install jq
    - apk add --no-cache bash curl jq
  script:
    - ls -la
    - chmod +x generate-tenants-pipeline.sh generate-values-files.sh
    - source generate-values-files.sh
    - source generate-tenants-pipeline.sh
  artifacts:
    paths:
      - generated-tenants-pipeline.yml
      - .gitlab/*.yaml  # Include the generated values files
      - .gitlab/ci-includes/*.yml  # Include the shared CI includes

deploy-tenants:
  stage: deploy
  needs:
    - job: generate-tenants-pipeline
      artifacts: true
  trigger:
    include:
      - artifact: generated-tenants-pipeline.yml
        job: generate-tenants-pipeline