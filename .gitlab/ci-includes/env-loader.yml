# Common environment loading snippet for CI pipelines
.load-env-file: &load-env-file
  - |
    if [ -n "$ENV_FILE" ]; then
      while IFS= read -r line || [ -n "$line" ]; do
        if [[ ! $line =~ ^# && $line =~ = ]]; then
          eval "export $line"
        fi
      done < <(cat "$ENV_FILE")
    fi
