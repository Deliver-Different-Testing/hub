# crossroads production: only what differs from ../auto-deploy-values.yaml.
# Placement (tenant label, node affinity, toleration) is generated at deploy time.
replicaCount: 2
hpa:
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 85
ingress:
  spec:
    ingressClassName: nginx
livenessProbe:
  initialDelaySeconds: 30
readinessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 5
